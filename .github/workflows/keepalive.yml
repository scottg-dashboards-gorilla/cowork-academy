name: keepalive

# Pings Supabase every 3 days so the free-tier database never idles into a pause.
on:
  schedule:
    - cron: '17 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: sb_publishable_NHXaBPH5DgErSn4e7cUBAQ_OJ1v0hPw" "https://zyavgqznjznjsddldyxg.supabase.co/rest/v1/")
          echo "Supabase responded with HTTP $code"
