<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cowork Academy Certificate</title>
<meta property="og:title" content="Cowork Academy Certificate of Completion">
<meta property="og:description" content="Hands-on training in Claude Cowork, by Datapath.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  body{display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;max-width:960px}
  .controls input,.controls select{background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:9px 12px;font-size:15px;font-family:var(--body)}
  .controls .hint{color:var(--slate);font-size:14px;width:100%;text-align:center;margin:4px 0 0}
  .share{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
  .share .li{background:#0A66C2;color:#fff;border-color:#0A66C2}
  .cert{position:relative;width:960px;max-width:96vw;aspect-ratio:1.414/1;background:#fff;border-radius:6px;
    box-shadow:0 30px 70px -36px rgba(20,33,61,.55);overflow:hidden;padding:5.2% 6%;color:var(--ink);container-type:inline-size}
  .cert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.4%;background:var(--ink)}
  .cert::after{content:"";position:absolute;left:2.4%;top:0;bottom:0;width:.7%;background:var(--spark)}
  .inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding-left:3%}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  .issuer{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:clamp(14px,2cqw,19px)}
  .issuer .mark{width:2.1em;height:2.1em;border-radius:.5em;background:var(--ink);display:grid;place-items:center}
  .issuer .mark i{width:.7em;height:.7em;border-radius:50%;background:var(--spark);box-shadow:0 0 0 .28em rgba(255,200,61,.25)}
  .kind{font-size:clamp(12px,1.5cqw,15px);color:var(--slate);text-align:right}
  h1{font-family:var(--display);font-size:clamp(26px,5.6cqw,54px);font-weight:800;margin:0;letter-spacing:-.025em;line-height:1}
  .awarded{font-size:clamp(13px,1.7cqw,16px);color:var(--slate);margin:2.2cqw 0 .4cqw}
  .name{font-family:var(--display);font-size:clamp(28px,6.4cqw,62px);font-weight:700;line-height:1.05;letter-spacing:-.02em;
    display:inline;background:linear-gradient(transparent 62%,var(--spark-soft) 62%,var(--spark-soft) 92%,transparent 92%)}
  .body{font-size:clamp(13px,1.75cqw,17px);line-height:1.6;max-width:44em;color:#2D3954;margin-top:2cqw}
  .body b{color:var(--ink)}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:4cqw;font-size:clamp(12px,1.5cqw,15px)}
  .facts{display:flex;gap:4.5cqw}
  .fact .v{font-family:var(--display);font-weight:800;font-size:clamp(16px,2.6cqw,26px)}
  .fact .l{color:var(--slate)}
  .seal{width:clamp(64px,11cqw,104px);aspect-ratio:1;border-radius:50%;background:var(--ink);color:var(--spark);display:grid;place-items:center;text-align:center;
    font-family:var(--display);font-weight:800;font-size:clamp(9px,1.25cqw,12px);line-height:1.2;box-shadow:inset 0 0 0 .5cqw var(--ink),inset 0 0 0 .75cqw var(--spark)}
  @media(max-width:700px){.cert{aspect-ratio:auto;padding:28px 20px 24px 30px}.inner{gap:22px}.facts{flex-wrap:wrap;gap:16px 24px}}
  @media print{body{background:#fff;padding:0}.controls,.share{display:none}.cert{box-shadow:none;width:100%;max-width:100%;border-radius:0}@page{size:A4 landscape;margin:0}}
</style>
</head>
<body>
  <div class="controls">
    <input id="in-name" type="text" placeholder="Your name" oninput="sync()" aria-label="Your name">
    <select id="in-track" onchange="sync()" aria-label="Certificate">
      <option value="Full Cowork Mastery">Full Cowork Mastery (all 3 levels)</option>
      <option value="Beginner — Your First Wins">Beginner: Your First Wins</option>
      <option value="Intermediate — The Smart Business">Intermediate: The Smart Business</option>
      <option value="Higher Intermediate — The Connected Product">Higher Intermediate: The Connected Product</option>
    </select>
    <input id="in-steps" type="text" placeholder="Steps done" oninput="sync()" style="width:110px" aria-label="Steps completed">
    <p class="hint">The Academy fills this in for you. Check your name, then save or share it.</p>
  </div>
  <div class="share">
    <button class="primary" onclick="window.print()">Save as PDF</button>
    <button class="li" onclick="addToProfile()">Add to LinkedIn profile</button>
    <button onclick="sharePost()">Share on LinkedIn</button>
    <button onclick="copyLink()">Copy link</button>
    <a class="btn" href="index.html">Back to the Academy</a>
  </div>

  <div class="cert" id="cert">
    <div class="inner">
      <div class="top">
        <div class="issuer"><span class="mark"><i></i></span>Cowork Academy</div>
        <div class="kind">Issued by Datapath</div>
      </div>
      <div>
        <h1>Certificate of Completion</h1>
        <div class="awarded">This certifies that</div>
        <div class="name" id="out-name">Your Name</div>
        <div class="body" id="out-body"></div>
      </div>
      <div class="foot">
        <div class="facts">
          <div class="fact"><div class="v" id="out-tracklabel">Track</div><div class="l">Completed</div></div>
          <div class="fact"><div class="v" id="out-steps">—</div><div class="l">Hands-on steps</div></div>
          <div class="fact"><div class="v" id="out-date">Date</div><div class="l">Date</div></div>
        </div>
        <div class="seal">COWORK<br>ACADEMY<br>★</div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const FULL="Full Cowork Mastery";
  function qp(k){return new URLSearchParams(location.search).get(k);}
  function bodyText(track){
    if(track===FULL) return `has completed <b>all three levels</b> of Cowork Academy, working hands-on in Claude Cowork with documents, spreadsheets, decks, research, skills, connectors, agents, live dashboards, automation, browser and desktop control, plugins and orchestration.`;
    return `has completed <b>${esc(track.replace(/ — /g,': '))}</b> at Cowork Academy, working hands-on in Claude Cowork on real tasks with documents, data, skills and connected tools.`;
  }
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function render(name,track,steps){
    document.getElementById('out-name').textContent=name||'Your Name';
    document.getElementById('out-body').innerHTML=bodyText(track);
    document.getElementById('out-steps').textContent=steps||'—';
    document.getElementById('out-tracklabel').textContent = track===FULL ? 'Full Mastery' : (track.split('—')[1]||track).trim();
  }
  function sync(){
    render(document.getElementById('in-name').value.trim(),
           document.getElementById('in-track').value,
           document.getElementById('in-steps').value.trim());
  }
  function shareUrl(){
    const p=new URLSearchParams();
    const n=document.getElementById('in-name').value.trim();
    const t=document.getElementById('in-track').value;
    const st=document.getElementById('in-steps').value.trim();
    if(n)p.set('name',n); if(t)p.set('track',t); if(st)p.set('steps',st);
    return location.origin+location.pathname+(p.toString()?'?'+p.toString():'');
  }
  function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
  function copyLink(){navigator.clipboard.writeText(shareUrl()).then(()=>toast('Link copied'));}
  function addToProfile(){
    const t=document.getElementById('in-track').value,d=new Date();
    const p=new URLSearchParams({startTask:'CERTIFICATION_NAME',name:'Cowork Academy: '+t.replace(/ — /g,': '),organizationName:'Datapath',
      issueYear:d.getFullYear(),issueMonth:d.getMonth()+1,certUrl:shareUrl()});
    window.open('https://www.linkedin.com/profile/add?'+p.toString(),'_blank','noopener');
  }
  function sharePost(){window.open('https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(shareUrl()),'_blank','noopener');}
  (function(){
    const n=qp('name'), t=qp('track'), s=qp('steps');
    if(n)document.getElementById('in-name').value=n;
    if(t){const sel=document.getElementById('in-track');
      let found=[...sel.options].some(o=>o.value===t);
      if(!found){const o=document.createElement('option');o.value=t;o.textContent=t;sel.insertBefore(o,sel.firstChild);}
      sel.value=t;}
    if(s)document.getElementById('in-steps').value=s;
    document.getElementById('out-date').textContent=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
    sync();
  })();
</script>
</body>
</html>
